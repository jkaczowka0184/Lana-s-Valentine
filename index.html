<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lana 💘</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(-45deg,#ff9a9e,#fad0c4,#fbc2eb,#a18cd1);
  background-size:400% 400%;
  animation:bgMove 12s ease infinite;
  font-family:"Poppins",sans-serif;
  overflow:hidden;
}

@keyframes bgMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.card{
  width:min(92%, 560px);
  padding:48px 34px 52px;
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(18px);
  border-radius:28px;
  text-align:center;
  box-shadow:0 30px 80px rgba(0,0,0,0.25),
             inset 0 0 0 1px rgba(255,255,255,0.4);
  position:relative;
  animation:cardIn 1.1s ease;
  overflow:hidden;
}

@keyframes cardIn{
  from{opacity:0;transform:translateY(30px) scale(0.95);}
  to{opacity:1;transform:translateY(0) scale(1);}
}

.card::before{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:30px;
  background:linear-gradient(120deg,#ff4d6d,#ff9a9e,#fbc2eb);
  z-index:-1;
  filter:blur(20px);
  opacity:0.7;
}

/* ---- PAGES: ONLY ONE CAN SHOW ---- */
.page{
  display:none !important;     /* hard force hidden */
  animation:fadeIn .55s ease forwards;
}
.page.active{
  display:block !important;    /* only active shows */
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}

.emoji{
  font-size:68px;
  margin-bottom:12px;
  animation:heartbeat 1.8s infinite;
}
@keyframes heartbeat{
  0%,100%{transform:scale(1);}
  25%{transform:scale(1.08);}
  50%{transform:scale(1);}
  75%{transform:scale(1.12);}
}

h2{
  font-family:"Playfair Display",serif;
  font-size:34px;
  color:#4a1c2f;
  margin-bottom:18px;
  line-height:1.25;
}

/* Page 1 layout */
#page1{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
  min-height: 320px;
  justify-content:center;
}

.p1text{
  font-size:20px;
  line-height:1.55;
  color:#2b2b2b;
  max-width: 520px;
}

.bigBtn{
  display:inline-block;
  padding:16px 56px;
  border-radius:40px;
  border:none;
  font-size:20px;
  font-weight:500;
  cursor:pointer;
  background:linear-gradient(135deg,#ff4d6d,#ff758f);
  color:#fff;
  box-shadow:0 15px 35px rgba(255,77,109,0.55);
  transition:all .25s ease;
}
.bigBtn:hover{transform:translateY(-3px);}

/* Page 2 buttons boundary */
.buttons{
  position:relative;
  height:130px;
  margin-top: 10px;
  border-radius: 18px;
}

button.choice{
  position:absolute;
  border-radius:40px;
  border:none;
  cursor:pointer;
  transition:transform .15s ease, box-shadow .25s ease;
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
  user-select:none;
  touch-action: manipulation;
}
button.choice:active{transform:scale(.94);}

/* YES bigger */
#yes{
  left:10%;
  top: 44px;
  padding:24px 72px;
  font-size:20px;
  background:linear-gradient(135deg,#ff4d6d,#ff758f);
  color:#fff;
  box-shadow:0 18px 45px rgba(255,77,109,.7);
}
#yes:hover{transform:translateY(-3px);}

/* NO smaller */
#no{
  left:58%;
  top: 52px;
  padding:12px 28px;
  font-size:15px;
  background:rgba(255,255,255,0.9);
  color:#777;
}

.hint{
  margin-top:22px;
  font-size:14px;
  color:#6b6b6b;
  font-style:italic;
}

/* Floating hearts */
.heart{
  position:absolute;
  bottom:-20px;
  animation:floatUp linear forwards;
  pointer-events:none;
}
@keyframes floatUp{
  from{transform:translateY(0) scale(1);opacity:1;}
  to{transform:translateY(-120vh) scale(1.8);opacity:0;}
}

.gif{
  margin-top:20px;
  width:100%;
  border-radius:20px;
  box-shadow:0 15px 40px rgba(0,0,0,0.2);
}

/* Small screens */
@media (max-width: 480px){
  .card{ width:min(94%, 520px); padding:42px 22px 46px; }
  h2{ font-size: 28px; }
  .emoji{ font-size: 60px; }
  .p1text{ font-size: 18px; }
  #yes{ padding: 22px 58px; font-size: 18px; }
  #no{ padding: 12px 24px; font-size: 14px; }
}
</style>
</head>

<body>

<div class="card">

  <!-- PAGE 1 -->
  <div class="page active" id="page1">
    <h2>Hi my baby Lana Bear</h2>
    <p class="p1text">I love you so much❤️. I wanted to ask you a very important question</p>
    <button class="bigBtn" id="continue">Continue</button>
  </div>

  <!-- PAGE 2 -->
  <div class="page" id="page2">
    <div class="emoji">😘❤️</div>
    <h2>Lana,<br>will you be my Valentine?</h2>

    <div class="buttons" id="buttonsBox">
      <button class="choice" id="yes">Yes 💖</button>
      <button class="choice" id="no">No 🙈</button>
    </div>

    <div class="hint">You may find it hard to say no to me😊</div>
  </div>

  <!-- PAGE 3 -->
  <div class="page" id="page3">
    <h2>YEEESSSS!!!!<br>I can’t wait to see you. I love you❤️</h2>
    <img src="giphy.gif" class="gif" alt="Valentine gif">
  </div>

</div>

<audio id="hoverSound" src="https://assets.mixkit.co/sfx/preview/mixkit-cartoon-voice-laugh-343.mp3"></audio>
<audio id="yesSound" src="https://assets.mixkit.co/sfx/preview/mixkit-achievement-bell-600.mp3"></audio>

<script>
const pages = Array.from(document.querySelectorAll(".page"));
const page1 = document.getElementById("page1");
const page2 = document.getElementById("page2");
const page3 = document.getElementById("page3");

const continueBtn = document.getElementById("continue");
const buttonsBox  = document.getElementById("buttonsBox");
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");

const hoverSound = document.getElementById("hoverSound");
const yesSound   = document.getElementById("yesSound");

function showPage(page){
  pages.forEach(p => p.classList.remove("active"));
  page.classList.add("active");
}

continueBtn.addEventListener("click", () => {
  showPage(page2);
  // reset no position when entering page2
  requestAnimationFrame(() => {
    noBtn.style.left = "58%";
    noBtn.style.top  = "52px";
  });
});

yesBtn.addEventListener("click", () => {
  yesSound.currentTime = 0;
  yesSound.play();
  confetti({ particleCount: 260, spread: 120, origin: { y: 0.65 } });
  setTimeout(() => showPage(page3), 450);
});

/* No button runs away but stays inside buttonsBox */
function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }

function setNoPosition(x, y){
  const boxRect = buttonsBox.getBoundingClientRect();
  const w = noBtn.offsetWidth;
  const h = noBtn.offsetHeight;

  const minX = 8, minY = 8;
  const maxX = boxRect.width  - w - 8;
  const maxY = boxRect.height - h - 8;

  noBtn.style.left = clamp(x, minX, maxX) + "px";
  noBtn.style.top  = clamp(y, minY, maxY) + "px";
}

function flee(clientX, clientY){
  const boxRect = buttonsBox.getBoundingClientRect();
  const btnRect = noBtn.getBoundingClientRect();

  const btnCX = btnRect.left + btnRect.width/2;
  const btnCY = btnRect.top  + btnRect.height/2;

  const dx = btnCX - clientX;
  const dy = btnCY - clientY;
  const dist = Math.hypot(dx, dy);

  const RUN_RADIUS = 95;
  const JUMP = 150;
  if (dist > RUN_RADIUS) return;

  hoverSound.currentTime = 0;
  hoverSound.play();

  const ux = dist === 0 ? (Math.random()-0.5) : dx / dist;
  const uy = dist === 0 ? (Math.random()-0.5) : dy / dist;

  const currentLeft = btnRect.left - boxRect.left;
  const currentTop  = btnRect.top  - boxRect.top;

  setNoPosition(currentLeft + ux * JUMP, currentTop + uy * JUMP);

  // if still too close, random safe spot
  const newRect = noBtn.getBoundingClientRect();
  const newCX = newRect.left + newRect.width/2;
  const newCY = newRect.top  + newRect.height/2;
  const newDist = Math.hypot(newCX - clientX, newCY - clientY);

  if (newDist < RUN_RADIUS * 0.9){
    const w = noBtn.offsetWidth;
    const h = noBtn.offsetHeight;
    const rx = 8 + Math.random() * (boxRect.width  - w - 16);
    const ry = 8 + Math.random() * (boxRect.height - h - 16);
    setNoPosition(rx, ry);
  }
}

buttonsBox.addEventListener("pointermove", (e) => {
  if (!page2.classList.contains("active")) return;
  flee(e.clientX, e.clientY);
});

noBtn.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  const boxRect = buttonsBox.getBoundingClientRect();
  const w = noBtn.offsetWidth;
  const h = noBtn.offsetHeight;
  const rx = 8 + Math.random() * (boxRect.width  - w - 16);
  const ry = 8 + Math.random() * (boxRect.height - h - 16);
  setNoPosition(rx, ry);
});

/* Floating hearts */
function createHeart(){
  const heart=document.createElement("div");
  heart.className="heart";
  heart.innerHTML=Math.random()>0.5?"❤️":"💗";
  heart.style.left=Math.random()*100+"vw";
  heart.style.fontSize=(Math.random()*22+14)+"px";
  heart.style.animationDuration=(Math.random()*3+4)+"s";
  heart.style.opacity=(Math.random()*0.5+0.4);
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),8000);
}
setInterval(createHeart,380);
</script>

</body>
</html>
