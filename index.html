<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lana 💘</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(-45deg,#ff9a9e,#fad0c4,#fbc2eb,#a18cd1);
background-size:400% 400%;
animation:bgMove 12s ease infinite;
font-family:"Poppins",sans-serif;
overflow:hidden;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
width:min(92%,420px);
padding:40px 30px 45px;
background:rgba(255,255,255,0.75);
backdrop-filter:blur(18px);
border-radius:28px;
text-align:center;
box-shadow:0 30px 80px rgba(0,0,0,0.25),
inset 0 0 0 1px rgba(255,255,255,0.4);
position:relative;
animation:cardIn 1.1s ease;
overflow:hidden;
}

@keyframes cardIn{
from{opacity:0;transform:translateY(30px) scale(0.95);}
to{opacity:1;transform:translateY(0) scale(1);}
}

.card::before{
content:"";
position:absolute;
inset:-2px;
border-radius:30px;
background:linear-gradient(120deg,#ff4d6d,#ff9a9e,#fbc2eb);
z-index:-1;
filter:blur(20px);
opacity:0.7;
}

/* Pages */
.page{
display:none;
animation:fadeIn .6s ease forwards;
}

.page.active{
display:block;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(10px);}
to{opacity:1;transform:translateY(0);}
}

.emoji{
font-size:68px;
margin-bottom:12px;
animation:heartbeat 1.8s infinite;
}

@keyframes heartbeat{
0%,100%{transform:scale(1);}
25%{transform:scale(1.08);}
50%{transform:scale(1);}
75%{transform:scale(1.12);}
}

h2{
font-family:"Playfair Display",serif;
font-size:26px;
color:#4a1c2f;
margin-bottom:24px;
line-height:1.35;
}

/* Continue button centered */
.bigBtn{
display:block;
margin:30px auto 0 auto;
padding:16px 48px;
border-radius:40px;
border:none;
font-size:18px;
cursor:pointer;
background:linear-gradient(135deg,#ff4d6d,#ff758f);
color:#fff;
box-shadow:0 15px 35px rgba(255,77,109,0.55);
transition:all .25s ease;
}

.bigBtn:hover{
transform:translateY(-3px);
}

/* Buttons area */
.buttons{
position:relative;
height:110px;
margin-top:10px;
}

button{
position:absolute;
border-radius:40px;
border:none;
cursor:pointer;
transition:all .25s ease;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

button:active{
transform:scale(.94);
}

/* YES twice as big */
#yes{
left:10%;
padding:24px 70px;
font-size:20px;
background:linear-gradient(135deg,#ff4d6d,#ff758f);
color:#fff;
box-shadow:0 18px 45px rgba(255,77,109,.7);
}

/* NO smaller */
#no{
left:55%;
padding:12px 28px;
font-size:15px;
background:rgba(255,255,255,0.9);
color:#777;
}

.hint{
margin-top:28px;
font-size:13px;
color:#6b6b6b;
font-style:italic;
}

/* Floating hearts */
.heart{
position:absolute;
bottom:-20px;
animation:floatUp linear forwards;
pointer-events:none;
}

@keyframes floatUp{
from{transform:translateY(0) scale(1);opacity:1;}
to{transform:translateY(-120vh) scale(1.8);opacity:0;}
}

.gif{
margin-top:20px;
width:100%;
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<div class="card">

<!-- PAGE 1 -->
<div class="page active" id="page1">
<h2>Hi my baby Lana Bear</h2>
<p style="margin-bottom:20px;">
I love you so much❤️. I wanted to ask you a very important question
</p>
<button class="bigBtn" id="continue">Continue</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
<div class="emoji">😘❤️</div>
<h2>Lana,<br>will you be my Valentine?</h2>

<div class="buttons">
<button id="yes">Yes 💖</button>
<button id="no">No 🙈</button>
</div>

<div class="hint">You may find it hard to say no to me😊</div>
</div>

<!-- PAGE 3 -->
<div class="page" id="page3">
<h2>YEEESSSS!!!!<br>I can’t wait to see you. I love you❤️</h2>
<img src="giphy.gif" class="gif">
</div>

</div>

<audio id="hoverSound" src="https://assets.mixkit.co/sfx/preview/mixkit-cartoon-voice-laugh-343.mp3"></audio>
<audio id="yesSound" src="https://assets.mixkit.co/sfx/preview/mixkit-achievement-bell-600.mp3"></audio>

<script>
const page1=document.getElementById("page1");
const page2=document.getElementById("page2");
const page3=document.getElementById("page3");
const continueBtn=document.getElementById("continue");
const noBtn=document.getElementById("no");
const yesBtn=document.getElementById("yes");
const card=document.querySelector(".card");
const hoverSound=document.getElementById("hoverSound");
const yesSound=document.getElementById("yesSound");

continueBtn.onclick=()=>{
page1.classList.remove("active");
page2.classList.add("active");
};

/* No button stays inside card */
noBtn.addEventListener("mouseenter",()=>{
hoverSound.currentTime=0;
hoverSound.play();

const cardRect=card.getBoundingClientRect();
const btnRect=noBtn.getBoundingClientRect();

const maxX=cardRect.width-btnRect.width-20;
const maxY=cardRect.height-btnRect.height-20;

noBtn.style.left=Math.random()*maxX+"px";
noBtn.style.top=Math.random()*maxY+"px";
});

yesBtn.addEventListener("click",()=>{
yesSound.play();

confetti({
particleCount:260,
spread:120,
origin:{y:0.65}
});

setTimeout(()=>{
page2.classList.remove("active");
page3.classList.add("active");
},500);
});

/* floating hearts */
function createHeart(){
const heart=document.createElement("div");
heart.className="heart";
heart.innerHTML=Math.random()>0.5?"❤️":"💗";
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=Math.random()*22+14+"px";
heart.style.animationDuration=Math.random()*3+4+"s";
heart.style.opacity=Math.random()*0.5+0.4;
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),8000);
}
setInterval(createHeart,380);
</script>

</body>
</html>
